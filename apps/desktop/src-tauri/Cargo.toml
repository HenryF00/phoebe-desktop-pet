[package]
name = "phoebe-desktop"
version = "0.9.0"
edition = "2021"
rust-version = "1.77.2"
default-run = "phoebe-desktop"

[lib]
name = "phoebe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
chrono = { version = "0.4", features = ["clock"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
rpassword = "7.4"
tauri-plugin-autostart = "=2.5.1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tauri-plugin-dialog = "=2.7.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = { version = "0.3", default-features = false, features = ["CLLocation", "CLLocationManager", "CLLocationManagerDelegate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Devices_Geolocation"] }
