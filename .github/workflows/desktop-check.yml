name: Desktop checks

on:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - "Cargo.toml"
      - "package*.json"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "Cargo.toml"
      - "package*.json"
      - ".github/workflows/desktop-check.yml"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo test --workspace
      - run: npm run tauri:build -w @phoebe/desktop
